<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>voltIQ – EV Charging Cost Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <header class="header">
      <div class="brand">
        <svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 3 14h7l-1 8 12-14h-7l1-6z"/></svg>
        <div>
          <h1>voltIQ</h1>
          <p class="subtitle">Charge smarter. Know your cost before you plug in.</p>
        </div>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Toggle theme">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke-linecap="round"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
    </header>

    <form id="calc-form" novalidate>
      <div class="field">
        <label for="capacity">Battery capacity <span class="unit">kWh</span></label>
        <input type="number" id="capacity" name="capacity" min="1" step="0.1" value="79" inputmode="decimal" />
      </div>

      <div class="row">
        <div class="field">
          <label for="current">Battery now <span class="unit">%</span></label>
          <input type="number" id="current" name="current" min="0" max="100" step="1" value="20" inputmode="numeric" />
        </div>
        <div class="field">
          <label for="target">Charge to <span class="unit">%</span></label>
          <input type="number" id="target" name="target" min="0" max="100" step="1" value="100" inputmode="numeric" />
        </div>
      </div>

      <div class="battery" aria-hidden="true">
        <div class="battery-body">
          <div id="battery-now" class="battery-fill battery-now"></div>
          <div id="battery-add" class="battery-fill battery-add"></div>
        </div>
        <div class="battery-cap"></div>
      </div>

      <fieldset class="field chargers">
        <legend>Charger</legend>
        <div class="chips" role="radiogroup" aria-label="Charger power">
          <label class="chip"><input type="radio" name="charger" value="7" /><span><strong>7 kW</strong><small>Home AC</small></span></label>
          <label class="chip"><input type="radio" name="charger" value="30" /><span><strong>30 kW</strong><small>Fast DC</small></span></label>
          <label class="chip"><input type="radio" name="charger" value="60" checked /><span><strong>60 kW</strong><small>Fast DC</small></span></label>
          <label class="chip"><input type="radio" name="charger" value="120" /><span><strong>120 kW</strong><small>Rapid DC</small></span></label>
        </div>
      </fieldset>
    </form>

    <section id="results" class="results" aria-live="polite">
      <div class="hero">
        <span class="hero-label">You pay</span>
        <span class="hero-value">₹<span id="total">—</span></span>
        <span class="hero-sub">at ₹25 / kWh · includes 18% GST</span>
      </div>

      <div class="stats">
        <div class="stat">
          <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M20 10h2v4h-2z"/><rect x="4.5" y="9.5" width="9" height="5" rx="1" class="fill"/></svg>
          <span class="stat-label">Energy to add</span>
          <span class="stat-value"><span id="energy">—</span> <small>kWh</small></span>
        </div>
        <div class="stat">
          <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6" stroke-linecap="round"/></svg>
          <span class="stat-label">Time to charge</span>
          <span class="stat-value" id="time">—</span>
        </div>
      </div>

      <details class="breakdown">
        <summary>GST breakdown</summary>
        <div class="breakdown-row"><span>Base price (excl. GST)</span><span>₹<span id="base">—</span></span></div>
        <div class="breakdown-row"><span>GST (18%)</span><span>₹<span id="gst">—</span></span></div>
        <div class="breakdown-row breakdown-total"><span>Total</span><span>₹<span id="total-breakdown">—</span></span></div>
      </details>
    </section>

    <p id="message" class="message" role="alert" hidden></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
