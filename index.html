<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>voltIQ – EV Charging Cost Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <header>
      <h1>voltIQ</h1>
      <p class="subtitle">How much charge do you need, and what will it cost?</p>
    </header>

    <form id="calc-form" novalidate>
      <div class="field">
        <label for="capacity">Battery capacity (kWh)</label>
        <input type="number" id="capacity" name="capacity" min="1" step="0.1" value="79" inputmode="decimal" />
      </div>

      <div class="row">
        <div class="field">
          <label for="current">Current battery %</label>
          <input type="number" id="current" name="current" min="0" max="100" step="1" value="20" inputmode="numeric" />
        </div>
        <div class="field">
          <label for="target">Target battery %</label>
          <input type="number" id="target" name="target" min="0" max="100" step="1" value="100" inputmode="numeric" />
        </div>
      </div>

      <p class="rate">Rate: <strong>₹25 / kWh</strong> (includes 18% GST)</p>
    </form>

    <section id="results" class="results" aria-live="polite">
      <div class="result-main">
        <div class="stat">
          <span class="stat-label">Energy to add</span>
          <span class="stat-value"><span id="energy">—</span> kWh</span>
        </div>
        <div class="stat stat-primary">
          <span class="stat-label">Amount to pay</span>
          <span class="stat-value">₹<span id="total">—</span></span>
        </div>
      </div>
      <div class="breakdown">
        <div class="breakdown-row">
          <span>Base price (excl. GST)</span>
          <span>₹<span id="base">—</span></span>
        </div>
        <div class="breakdown-row">
          <span>GST (18%)</span>
          <span>₹<span id="gst">—</span></span>
        </div>
        <div class="breakdown-row breakdown-total">
          <span>Total (incl. GST)</span>
          <span>₹<span id="total-breakdown">—</span></span>
        </div>
      </div>
    </section>

    <p id="message" class="message" role="alert" hidden></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
